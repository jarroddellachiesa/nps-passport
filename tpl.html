<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NPS Passport</title>
<meta name="description" content="A virtual National Park Service passport: {{VISITED}} of {{TOTAL}} units visited.">
<meta property="og:title" content="NPS Passport"><meta property="og:image" content="img/cover.jpg">
<link rel="icon" href="img/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,600&family=Fira+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1426;--navy:#14233f;--gold:#d4ae55;--gold2:#f3dd98;--paper:#f5efdf;--ink:#2a3d62;--red:#8c1d1d;--serif:"Crimson Pro",Georgia,serif;--sans:"Fira Sans",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 15%,#22385f,var(--navy) 45%,var(--bg) 100%);color:var(--paper);font-family:var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background:repeating-radial-gradient(circle at 50% 30%,transparent 0 6px,#d4ae55 6px 7px)}
header{text-align:center;padding:22px 16px 8px}
h1{font-family:var(--serif);font-weight:700;letter-spacing:.06em;font-size:clamp(26px,7vw,40px);margin:0;background:linear-gradient(170deg,var(--gold2),var(--gold) 40%,#9c7629 60%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.2)}
h1 em{display:block;font-size:.5em;font-weight:600;letter-spacing:.04em}
header p{margin:8px 0 0;opacity:.8;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
.stage{perspective:2200px;display:flex;justify-content:center;padding:10px 12px 0}
.book{position:relative;width:min(92vw,calc((100svh - 190px)*.72),560px);aspect-ratio:900/1250;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.1,.2,1)}
.leaf.turned{transform:rotateY(-178deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 12px 12px 4px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.front img{width:100%;height:100%;display:block}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%,rgba(255,255,255,.04) 50%,rgba(0,0,0,.06));pointer-events:none}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#e9e1cb,#f4eedd)}
.leaf.turned{pointer-events:none}.leaf.gone{visibility:hidden}
.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:16px}
.nav .arrow{background:none;border:1px solid rgba(216,185,106,.6);color:var(--gold);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
.nav .arrow:disabled{opacity:.3}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(244,238,221,.3);cursor:pointer}
.dot.on{background:var(--gold)}
.fsbtn{display:flex;align-items:center;gap:7px;margin:0 auto 10px;background:#13294a;border:1px solid rgba(216,185,106,.7);color:var(--gold);font:600 12px var(--sans);letter-spacing:.12em;padding:7px 14px;border-radius:18px;cursor:pointer}
.fsbtn svg{width:14px;height:14px}
.fsclose{display:none;position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:1000;background:#13294a;border:1px solid rgba(216,185,106,.7);color:var(--gold);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
#viewer.fs{position:fixed;inset:0;z-index:999;background:#05080f;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer.fs .stage{padding:8px}
#viewer.fs .book{width:min(calc(100vw - 16px),calc((100dvh - 96px)*.72))}
#viewer.fs .fsclose{display:block}#viewer.fs .fsbtn{display:none}
#viewer.fs .nav{padding:12px}
html.fslock,html.fslock body{overflow:hidden}
.hint{text-align:center;font-size:13px;opacity:.55;margin:-6px 0 10px}
section{max-width:620px;margin:34px auto 50px;padding:0 14px}
h2{color:var(--gold);font-family:var(--serif);font-weight:700;letter-spacing:.08em;text-align:center;font-size:28px;margin-bottom:6px}
h2::after{content:"";display:block;width:120px;height:3px;margin:8px auto 0;border-top:2px solid var(--gold);border-bottom:1px solid var(--gold);height:2px}
table{width:100%;border-collapse:collapse;background:var(--paper) linear-gradient(135deg,#f8f3e6,#efe5cc);color:#1f2a36;border-radius:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(212,174,85,.5);font-family:var(--sans)}
td{padding:12px 14px;border-bottom:1px solid #e0d6bd;vertical-align:middle}
td span{display:block;font-size:12px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;margin-top:3px;font-family:Helvetica,Arial,sans-serif}
td b{font-weight:700;font-family:var(--serif);font-size:17px}.rk{width:44px;text-align:center;color:#8a7a55;font-size:18px}
.rt{text-align:right;color:var(--ink);font-weight:bold;font-size:22px;white-space:nowrap;font-family:Helvetica,Arial,sans-serif}.rt small{font-size:12px;opacity:.7}
tr:nth-child(even) td{background:rgba(160,130,60,.08)}td{border-bottom:1px solid rgba(42,61,98,.15)}
.big{text-align:center;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}.big b{display:block;font-family:var(--serif);font-size:56px;letter-spacing:0;color:var(--gold)}
h3{color:var(--gold2);font-weight:600;letter-spacing:.2em;font-size:13px;border-bottom:1px solid rgba(212,174,85,.4);padding-bottom:6px;margin:26px 0 10px;text-transform:uppercase}
.reg i{display:inline-block;width:22px;height:14px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);margin-right:10px;vertical-align:-1px}
.dt{width:110px;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#555}td em{display:block;font-size:13px;color:#555;margin-top:3px}
.empty{text-align:center;color:#777;font-style:italic}
.filt{display:flex;gap:8px}.filt input{flex:1;padding:10px;border-radius:4px;border:1px solid var(--gold);background:var(--paper);font:15px var(--sans)}.filt select{border-radius:4px;border:1px solid var(--gold);background:var(--paper);padding:0 8px;font:15px var(--sans)}
html,body{overflow-x:hidden;max-width:100%}
table{table-layout:fixed}td{overflow-wrap:anywhere;word-break:break-word}
td span{white-space:normal}
#ut td.st{width:92px;white-space:normal;text-align:right}
.filt input{min-width:0;width:100%}.filt select{flex:0 0 auto;min-height:40px;max-width:40%}
@media (max-width:400px){.filt{flex-wrap:wrap}.filt select{flex:1 1 100%;max-width:none}}
.reg td.rt{width:90px}.dt{width:96px}
section{box-sizing:border-box;width:100%}
.cnt{font-size:13px;opacity:.7}.st{text-align:right;font-family:Helvetica,Arial,sans-serif;font-size:13px}.st.y{color:#1b6b2e;font-weight:700}.st.n{color:#999}
footer{text-align:center;font-size:12px;opacity:.45;padding-bottom:30px}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
</style></head><body>
<header><h1>Passport<em>To Your National Parks</em></h1><p>{{VISITED}} of {{TOTAL}} units visited · {{NREG}} regions</p></header>
<div id="viewer"><button class="fsclose" id="fsclose" aria-label="Exit full screen">×</button>
<div class="stage"><div class="book" id="book">
{{LEAVES}}
</div></div>
<div class="nav"><button class="arrow" id="prev" aria-label="Previous page">‹</button>{{DOTS}}<button class="arrow" id="next" aria-label="Next page">›</button></div>
</div>
<div class="hint">Tap or swipe to turn the page</div>
<button class="fsbtn" id="fsbtn" aria-label="Full screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg>FULL SCREEN</button>
<section id="all"><h2>TRACKER</h2>
<p class="big"><b>{{VISITED}}</b> of {{TOTAL}} units visited</p>
<h3>By region</h3><table class="reg">{{REGROWS}}</table>
<h3>Cancellations ({{NVIS}})</h3><table>{{VISITS}}</table>
<h3>All units</h3>
<div class="filt"><input id="q" type="search" placeholder="Search name, code, state, designation…" aria-label="Search units">
<select id="fv" aria-label="Filter"><option value="">All</option><option value="1">Visited</option><option value="0">Not visited</option></select></div>
<p id="cnt" class="cnt"></p><table id="ut"></table></section>
<script>
const leaves=[...document.querySelectorAll('.leaf')],dots=[...document.querySelectorAll('.dot')],N=leaves.length;let cur=0;
function show(i){cur=Math.max(0,Math.min(N-1,i));leaves.forEach((l,k)=>{l.classList.toggle('turned',k<cur);
 l.style.zIndex=k<cur?k:N-k;clearTimeout(l._t);if(k<cur-1)l._t=setTimeout(()=>l.classList.add('gone'),900);else l.classList.remove('gone')});
 dots.forEach((d,k)=>d.classList.toggle('on',k==cur));prev.disabled=cur==0;next.disabled=cur==N-1;history.replaceState(null,'',cur?'#p'+cur:location.pathname)}
const book=document.getElementById('book');let sx=null,sy=0,moved=false;
book.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false});
book.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))show(cur+(dx<0?1:-1));
 else if(Math.abs(dx)<10&&Math.abs(dy)<10){const r=book.getBoundingClientRect();show(cur+(e.clientX-r.left<r.width*.3?-1:1))}sx=null});
prev.onclick=()=>show(cur-1);next.onclick=()=>show(cur+1);dots.forEach((d,k)=>d.onclick=()=>show(k));
const viewer=document.getElementById('viewer'),fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let overlay=false;
function setFs(on){viewer.classList.toggle('fs',on);document.documentElement.classList.toggle('fslock',on)}
function enterFs(){const r=viewer.requestFullscreen||viewer.webkitRequestFullscreen;
 if(r&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){Promise.resolve(r.call(viewer)).catch(()=>{overlay=true;setFs(true)})}
 else{overlay=true;setFs(true)}}
function exitFs(){if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{overlay=false;setFs(false)}}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setFs(!!fsEl()||overlay)));
fsbtn.onclick=enterFs;fsclose.onclick=exitFs;
addEventListener('keydown',e=>{if(e.key=='Escape'&&overlay)exitFs()});
addEventListener('keydown',e=>{if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1)});
const m=location.hash.match(/^#p(\d+)/);show(m?+m[1]:0);
const U={{UNITS}},ut=document.getElementById('ut'),q=document.getElementById('q'),fv=document.getElementById('fv'),cnt=document.getElementById('cnt');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){const s=q.value.toLowerCase().trim(),f=fv.value;const r=U.filter(u=>(!s||u.slice(0,5).join(' ').toLowerCase().includes(s))&&(f===''||(u[5]>0)==(f==='1')));
 cnt.textContent=r.length+' of '+U.length+' units';
 ut.innerHTML=r.map(u=>`<tr><td><b>${esc(u[1])}</b><span>${esc(u[0])} · ${esc(u[2])} · ${esc(u[3])} · ${esc(u[4])}</span></td><td class="st ${u[5]?'y':'n'}">${u[5]?'✓ Visited':'Not visited'}</td></tr>`).join('')}
q.oninput=fv.onchange=draw;draw();
</script></body></html>
